name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Загрузка приложения (node)
        run: node tests/check-app.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Аудит бестиария
        run: python3 _audit_bestiary.py --ci
