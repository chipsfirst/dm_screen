name: Сборка и релиз

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Создать релиз с этим тегом (например, v1.0.0). Пусто — только артефакты"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - os: macos-15
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          export V="${GITHUB_REF_NAME#v}"
          node -e "
            const fs=require('fs');
            const p='src-tauri/tauri.conf.json';
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            d.version=process.env.V;
            fs.writeFileSync(p, JSON.stringify(d,null,2)+'\n');
          "
          node -e "
            const fs=require('fs');
            const v=process.env.V;
            const p='index.html';
            const s=fs.readFileSync(p,'utf8');
            fs.writeFileSync(p, s.replace(/<span id=\"appVersion\">[^<]*<\/span>/, '<span id=\"appVersion\">'+v+'</span>'));
          "
          echo "Версия приложения: $V"

      - name: Собрать веб-файлы в dist
        shell: bash
        run: bash packaging/pack_web.sh dist

      - name: Установить Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Сгенерировать иконки
        shell: bash
        run: tauri icon app-icon.png --output src-tauri/icons

      - name: Собрать установщики
        run: tauri build --target ${{ matrix.target }}

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  release:
    name: Публикация релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Показать найденные файлы
        run: find artifacts -type f | sort

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Ширма мастера ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
