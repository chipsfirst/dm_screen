[package]
name = "shirma-master"
version = "1.1.1"
description = "Ширма мастера — локальный инструмент мастера D&D"
authors = ["Ролёвки от Вовки"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
