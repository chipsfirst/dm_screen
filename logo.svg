<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="d20">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8fb"/>
      <stop offset="0.55" stop-color="#c9d2db"/>
      <stop offset="1" stop-color="#8e99a4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ee"/>
    </linearGradient>
  </defs>
  <!-- корпус d20 -->
  <polygon points="50,5 88,27 88,73 50,95 12,73 12,27"
           fill="url(#face)" stroke="#23262b" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- рёбра -->
  <g stroke="#23262b" stroke-width="1.3" stroke-linejoin="round" fill="none">
    <polygon points="50,30 76,66 24,66" fill="url(#core)"/>
    <line x1="50" y1="5" x2="50" y2="30"/>
    <line x1="88" y1="27" x2="76" y2="66"/>
    <line x1="88" y1="73" x2="76" y2="66"/>
    <line x1="50" y1="95" x2="76" y2="66"/>
    <line x1="50" y1="95" x2="24" y2="66"/>
    <line x1="12" y1="73" x2="24" y2="66"/>
    <line x1="12" y1="27" x2="24" y2="66"/>
  </g>
  <!-- золотые блики на гранях -->
  <g stroke="#d9b64a" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="50" y1="9" x2="50" y2="27"/>
    <line x1="50" y1="33" x2="72" y2="65"/>
    <line x1="50" y1="33" x2="28" y2="65"/>
  </g>
</svg>
